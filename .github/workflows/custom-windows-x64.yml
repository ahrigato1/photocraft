name: Build PhotoCraft custom Windows x64

on:
  workflow_dispatch:
  push:
    branches: ["custom-0.7.1"]
    paths:
      - ".github/workflows/custom-windows-x64.yml"
      - "custom-0.7.1.patch"
      - "custom-0.7.1-custom.2.patch"
      - "custom-0.7.1-custom.3.patch"
      - "custom-0.7.1-custom.4.patch"
      - "custom-0.7.1-custom.5.patch"
      - "custom-0.7.1-custom.6.py"
      - "custom-0.7.1-custom.7.py"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply custom patches
        shell: pwsh
        run: |
          git apply --check custom-0.7.1.patch
          git apply custom-0.7.1.patch
          git apply --check custom-0.7.1-custom.2.patch
          git apply custom-0.7.1-custom.2.patch
          git apply --check custom-0.7.1-custom.3.patch
          git apply custom-0.7.1-custom.3.patch
          git apply --check custom-0.7.1-custom.4.patch
          git apply custom-0.7.1-custom.4.patch
          git apply --check custom-0.7.1-custom.5.patch
          git apply custom-0.7.1-custom.5.patch
          python custom-0.7.1-custom.6.py
          python custom-0.7.1-custom.7.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set custom version
        shell: pwsh
        run: cargo xtask version set 0.7.1-custom.7

      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts

      - uses: Swatinem/rust-cache@v2
        with:
          key: custom-windows-x64-v2

      - name: Fast patch sanity check
        shell: pwsh
        run: git diff --check

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Build MSI and portable ZIP
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-0.7.1-custom.7-windows-x64
          path: dist/release/*
          if-no-files-found: error
